name: Windows build and artifacts

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build, run outcome tests, and validate packages
        run: '& ./scripts/release.ps1 | Out-Host'
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crest-windows-x64-${{ github.sha }}
          path: |
            artifacts/release/Crest-Setup-*-x64.exe
            artifacts/release/Crest-Portable-*-x64.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
