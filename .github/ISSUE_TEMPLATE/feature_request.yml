name: Feature request
description: Propose a useful change to Crest.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe when this would help you.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Include the exact user action and expected result, any Windows APIs or named provider/app, permissions, service cost, offline behavior, and data retention. Integrations must use Crest's existing visibility controller.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Integration compatibility, if applicable
      description: Name the specific device/app/service and supported operation. Link public API documentation when available. Do not post account tokens, private calendar links, phone messages, or other personal content.
